site_name: Proper Transient Finder
site_author: Pier-Francesco Rocci
site_description: PSF-matched FITS difference imaging and transient-candidate analysis.
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  font: false
  icon:
    logo: material/telescope
  palette:
    - scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

nav:
  - Quick Start: index.md
  - User Guide: user-guide.md
  - API Reference: API.md
  - Publish Documentation: publishing.md

plugins:
  - search

hooks:
  - scripts/mkdocs_hooks.py

watch:
  - README.md
  - USER_GUIDE.md
  - scripts/mkdocs_hooks.py

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - toc:
      permalink: true
      toc_depth: 3

validation:
  links:
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn
