name: Publish Python package to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check Out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set Up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Verify Tag Matches Package Version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(python -c "import runpy; print(runpy.run_path('src/proper_transient_finder/_version.py')['__version__'])")"
          # Accept both release tag styles used by this repository: v<version>
          # and the historical v_<version> (tags v_0.1.0 through v_0.3.1).
          NORMALIZED="${TAG#v}"
          NORMALIZED="${NORMALIZED#_}"
          if [ "$NORMALIZED" != "$VERSION" ]; then
            echo "::error::Tag '$TAG' does not match package version '$VERSION' in src/proper_transient_finder/_version.py"
            exit 1
          fi
          echo "Tag '$TAG' matches package version '$VERSION'."
      - name: Install Development Environment
        run: PYTHON=python bash scripts/tasks.sh bootstrap
      - name: Run Astronomy Tests
        run: PYTHON=python bash scripts/tasks.sh test
      - name: Build Wheel And Source Archive
        run: python -m build
      - name: Upload Distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/proper-transient-finder
    permissions:
      id-token: write
    steps:
      - name: Download Distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish Package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/proper-transient-finder
    permissions:
      id-token: write
    steps:
      - name: Download Distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish Package
        uses: pypa/gh-action-pypi-publish@release/v1
