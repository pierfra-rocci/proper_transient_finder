name: Proper Transient Finder

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"

jobs:
  windows:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: pwsh
        working-directory: .
    steps:
      - name: Check Out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set Up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Development Environment
        run: ./scripts/bootstrap.ps1 -PythonPath (Get-Command python).Source
      - name: Install Documentation Tools
        run: python -m pip install --editable ".[docs]"
      - name: Check Lint And Formatting
        run: ./scripts/lint.ps1 -PythonPath (Get-Command python).Source
      - name: Run Astronomy Tests
        run: ./scripts/test.ps1 -PythonPath (Get-Command python).Source
      - name: Check And Build Documentation
        if: matrix.python-version == '3.13'
        run: ./scripts/docs.ps1 -PythonPath (Get-Command python).Source -Check -Build
      - name: Build Wheel And Source Archive
        if: matrix.python-version == '3.13'
        run: ./scripts/build.ps1 -PythonPath (Get-Command python).Source -NoIsolation

  posix:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - name: Check Out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Set Up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Development Environment
        run: PYTHON=python bash scripts/tasks.sh bootstrap
      - name: Install Documentation Tools
        run: python -m pip install --editable ".[docs]"
      - name: Check Lint And Formatting
        run: PYTHON=python bash scripts/tasks.sh lint
      - name: Run Astronomy Tests
        run: PYTHON=python bash scripts/tasks.sh test
      - name: Check And Build Documentation
        if: matrix.python-version == '3.13'
        run: PYTHON=python bash scripts/tasks.sh docs --check --build
      - name: Build Wheel And Source Archive
        if: matrix.python-version == '3.13'
        run: PYTHON=python bash scripts/tasks.sh build --no-isolation
