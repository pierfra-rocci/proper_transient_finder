name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'README.md'
      - 'USER_GUIDE.md'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - 'src/proper_transient_finder/**'
      - 'scripts/generate_docs.py'
      - 'scripts/mkdocs_hooks.py'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      # Install only the [docs] extra from pyproject.toml, so the site build
      # keeps the pinned MkDocs versions without pulling the astronomy runtime.
      - name: Install Documentation Tools
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          requirements = project["project"]["optional-dependencies"]["docs"]
          subprocess.run([sys.executable, "-m", "pip", "install", *requirements], check=True)
          PY

      - name: Regenerate API Reference
        run: python scripts/generate_docs.py

      - name: Build documentation
        run: python -m mkdocs build --strict --config-file mkdocs.yml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
