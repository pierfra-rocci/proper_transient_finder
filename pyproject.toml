[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proper-transient-finder"
authors = [{name = "Pier-Francesco Rocci"}]
dynamic = ["version"]
description = "PSF-matched FITS difference imaging and transient candidate analysis."
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Typing :: Typed",
]
dependencies = [
    "properimage==0.7.2",
    "astropy>=8.0,<9",
    "numpy>=2.0,<3",
    "scipy>=1.15,<2",
    "pandas>=2.2,<4",
    "matplotlib>=3.9,<4",
    "sep>=1.4,<2",
    "astroscrappy>=1.3,<2",
    "astroalign>=2.6,<3",
    "reproject>=0.18,<1",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7,<10",
]
dev = [
    "build>=1.2,<2",
    "setuptools>=77,<81",
    "wheel",
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
proper-transient-finder = "proper_transient_finder.astro:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["proper_transient_finder*"]

[tool.setuptools.dynamic]
version = {attr = "proper_transient_finder._version.__version__"}

[tool.setuptools.package-data]
proper_transient_finder = ["py.typed"]